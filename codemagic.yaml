workflows:
  android-release:
    name: Android Release APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Report release signing status
        script: |
          if grep -q 'signingConfigs.getByName("debug")' android/app/build.gradle.kts; then
            echo "WARNING: Production release signing is not configured; using the existing debug signing configuration."
          fi
      - name: Build Android release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
